# Run the whole project:  docker compose up --build
#   Site  http://localhost:3000     API  http://localhost:8000/api     Admin  http://localhost:8000/admin/
# Admin login (once):      docker compose exec backend python manage.py createsuperuser
# Backend tests:           docker compose exec backend pytest -q
# Start over (wipe data):  docker compose down -v
# Ports taken by another project? Pick others, e.g.:
#   WEB_PORT=3001 API_PORT=8001 DB_PORT=5433 docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: herpath
    ports:
      - "${DB_PORT:-5432}:5432" # for psql / host-side tools; the app itself talks to db inside Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DEBUG: "1"
      DATABASE_URL: postgres://postgres:postgres@db:5432/herpath
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
      FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app # backend code edits reload without a rebuild
    depends_on:
      db:
        condition: service_healthy
    healthcheck: # ready once migrations and seeding are done and Django answers
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  frontend:
    build: # production build; rebuild after frontend changes (or use `npm run dev` on the host)
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/api # the address browsers use
    environment:
      API_URL: http://backend:8000/api # server-rendered pages reach the API inside the Docker network
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
